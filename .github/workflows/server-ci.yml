name: Server CI

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  push:
    branches:
      - master
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_FILE: server/compose.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Pull runtime images
        run: |
          for attempt in 1 2 3; do
            if docker compose pull database playerbot-setup; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "Unable to pull runtime images after three attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Build and start fresh server stack
        run: docker compose up --build --detach

      - name: Wait for server startup
        run: |
          for attempt in {1..60}; do
            server_logs="$(docker compose logs server)"
            if grep --quiet "TFS Server Online!" <<<"$server_logs"; then
              exit 0
            fi
            running_services="$(docker compose ps --status running --services)"
            if ! grep --quiet --extended-regexp '^server$' <<<"$running_services"; then
              echo "Server container stopped before reaching online state." >&2
              exit 1
            fi
            sleep 2
          done
          echo "Server did not reach online state within 120 seconds." >&2
          exit 1

      - name: Verify database and playerbot provisioning
        run: |
          test "$(docker inspect --format '{{.State.Health.Status}}' angelion-database-1)" = "healthy"
          test "$(docker inspect --format '{{.State.ExitCode}}' angelion-playerbot-setup-1)" = "0"
          roster="$(
            docker compose exec -T database \
              mariadb --user=angelion --password=angelion --batch --skip-column-names angelion \
              --execute="
                SELECT players.name, accounts.name, players.id, players.deletion
                FROM player_bots
                JOIN players ON players.id = player_bots.player_id
                JOIN accounts ON accounts.id = players.account_id
                ORDER BY players.name;
              "
          )"
          ROSTER="$roster" python3 - <<'PY' >> "$GITHUB_ENV"
          import os

          rows = [line.split("\t") for line in os.environ["ROSTER"].splitlines()]
          assert len(rows) == 2, rows
          for row, name, account, variable in zip(
              rows, ("Bot One", "Bot Two"), ("bot-one", "bot-two"),
              ("BOT_ONE_ID", "BOT_TWO_ID"), strict=True,
          ):
              assert row[:2] == [name, account] and row[3] == "0", row
              print(f"{variable}={int(row[2])}")
          assert rows[0][2] != rows[1][2]
          PY

      - name: Verify structured playerbot log
        run: |
          server_id="$(docker compose ps --quiet server)"
          started_at="$(docker inspect --format '{{.State.StartedAt}}' "$server_id")"
          for attempt in {1..30}; do
            if docker logs --since "$started_at" "$server_id" 2>&1 | python3 -c '
          import json
          import os
          import sys

          expected = {"Bot One": int(os.environ["BOT_ONE_ID"]),
                      "Bot Two": int(os.environ["BOT_TWO_ID"])}
          online = {}
          for line in sys.stdin:
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              if (event.get("schema") != 1 or event.get("component") != "playerbot"
                      or event.get("event") != "lifecycle" or event.get("status") != "online"):
                  continue
              name = event.get("bot")
              if name not in expected:
                  continue
              assert event["player_id"] == expected[name], event
              assert set(event["position"]) == {"x", "y", "z"}, event
              assert event.get("server_run_id"), event
              online[name] = event["server_run_id"]
          assert set(online) == set(expected), (online, expected)
          assert len(set(online.values())) == 1, online
          ' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Both registered bots did not emit online lifecycle events in this server run." >&2
          exit 1

      - name: Verify local game ports
        run: |
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/7171'
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/7172'

      - name: Print service logs
        if: always()
        run: docker compose logs

      - name: Remove disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
