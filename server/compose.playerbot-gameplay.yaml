services:
  playerbot-setup:
    environment:
      PLAYERBOT_SEED_BOT_TWO: "false"
      PLAYERBOT_SEED_PALADINS: "false"

  database:
    volumes:
      - ./schema/insertPlayerbots.sql:/test-schema/04-playerbots.sql:ro

  server:
    environment:
      PLAYERBOT_GAMEPLAY_MODE: "${PLAYERBOT_GAMEPLAY_MODE:-cycle}"
      PLAYERBOT_MUTABLE_PORTAL_VARIANT: "${PLAYERBOT_MUTABLE_PORTAL_VARIANT:-closed_with_shovel}"
      PLAYERBOT_DEPOT_RESTART_PHASE: "${PLAYERBOT_DEPOT_RESTART_PHASE:-}"
      PLAYERBOT_DEPOT_VERIFIER_PHASE: "${PLAYERBOT_DEPOT_VERIFIER_PHASE:-}"
      PLAYERBOT_DEPOT_MOVE_CASE: "${PLAYERBOT_DEPOT_MOVE_CASE:-normal}"
    volumes:
      - ./tests/playerbot-gameplay:/app/data/scripts/playerbot-gameplay:ro
      - ./tests/playerbot-monsters/corpse.lua:/app/data/monster/lua/playerbot_corpse_monsters.lua:ro
      - ./tests/playerbot-gameplay/raids:/app/data/raids/playerbot-fixture:ro
      # Ordinary scenarios retain the normal catalog. Only raid scenarios select
      # the isolated catalog; no host config or production raid file is rewritten.
      - ${PLAYERBOT_RAID_CATALOG:-./data/raids/raids.xml}:/app/data/raids/raids.xml:ro
