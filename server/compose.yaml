name: angelion

services:
  database:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: angelion
      MARIADB_USER: angelion
      MARIADB_PASSWORD: angelion
      MARIADB_ROOT_PASSWORD: angelion-root
    command: --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - database-data:/var/lib/mysql
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./schema/insertGOD.sql:/docker-entrypoint-initdb.d/02-god.sql:ro
      - ./schema/insertLocalCharacters.sql:/docker-entrypoint-initdb.d/03-local-characters.sql:ro

  playerbot-setup:
    image: mariadb:10.6
    depends_on:
      database:
        condition: service_healthy
    environment:
      MYSQL_PWD: angelion
    command:
      - sh
      - -c
      - |
        mariadb --host=database --user=angelion angelion < /schema/insertPlayerbots.sql
        count="$$(mariadb --host=database --user=angelion --skip-column-names angelion -e "
          SELECT COUNT(*) FROM player_bots
          JOIN players ON players.id = player_bots.player_id
          JOIN accounts ON accounts.id = players.account_id
          WHERE players.name = 'Bot One' AND accounts.name = 'bot-one' AND players.deletion = 0;
        ")"
        if [ "$$count" != "1" ]; then
          echo "Bot One identity collision or deletion prevents playerbot provisioning." >&2
          exit 1
        fi
    restart: "no"
    volumes:
      - ./schema/insertPlayerbots.sql:/schema/insertPlayerbots.sql:ro

  server:
    build: .
    environment:
      PLAYERBOT_ENABLED: ${PLAYERBOT_ENABLED:-true}
      PLAYERBOT_HUNT_DURATION_SECONDS: ${PLAYERBOT_HUNT_DURATION_SECONDS:-300}
      PLAYERBOT_RELOG_DELAY_SECONDS: ${PLAYERBOT_RELOG_DELAY_SECONDS:-5}
      PLAYERBOT_MAX_CONSECUTIVE_DEATHS: ${PLAYERBOT_MAX_CONSECUTIVE_DEATHS:-3}
      PLAYERBOT_SPEED_BONUS: ${PLAYERBOT_SPEED_BONUS:-300}
      PLAYERBOT_GAMEPLAY_MODE: ${PLAYERBOT_GAMEPLAY_MODE:-}
    depends_on:
      playerbot-setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:7171:7171"
      - "127.0.0.1:7172:7172"
    restart: unless-stopped
    stop_grace_period: 1m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config.lua:/app/config.lua:ro
      - ./data:/app/data

volumes:
  database-data:
